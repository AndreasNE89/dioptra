name: check

# Reports only. GitHub Pages deploys main whether or not this passes, so a red
# run here does not stop a broken page from going live: run it before merging.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node is preinstalled on the runner and the checker has no dependencies,
      # so there is nothing to install.
      - run: node tools/check.mjs
      # Breaks copies of the pages on purpose and expects the checker to notice.
      - run: node tools/check-selftest.mjs
